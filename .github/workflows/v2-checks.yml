name: V2 checks
on:
  pull_request:
  push:
    branches: [main, feat/v2-foundations]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --legacy-peer-deps
      - run: npm ci --prefix import-comptes --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
