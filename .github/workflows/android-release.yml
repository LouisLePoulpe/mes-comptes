name: Android signed release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de release à publier avec l'APK (ex. v2.1.2). Laisser vide pour ne produire que l'artefact."
        required: false
        default: ""
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --legacy-peer-deps
      - name: Prepare private release configuration
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_CONFIG: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY"
          test -n "$FIREBASE_CONFIG"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/poulpecule.p12"
          printf '%s' "$FIREBASE_CONFIG" > android/app/google-services.json
      - run: npm run android:sync -- --production
      - run: chmod +x android/gradlew
      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/poulpecule.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: poulpecule-2.1.2-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publish APK as GitHub release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Poulpecule-$VERSION.apk"
          # The tag is created on the current head of main if it does not exist yet.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/Poulpecule-$VERSION.apk" --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/Poulpecule-$VERSION.apk" \
              --target main --title "Poulpécule $VERSION" \
              --notes "APK Android signé de Poulpécule $VERSION. Pour mettre à jour une installation existante, installe simplement cet APK par-dessus : il est signé avec la même clé que les versions précédentes."
          fi
      - name: Remove private build files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/poulpecule.p12" android/app/google-services.json
