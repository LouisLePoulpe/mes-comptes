name: Android connected email test
on:
  push:
    branches: [feat/v2-foundations]
permissions:
  contents: read
jobs:
  connected-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --legacy-peer-deps
      # Produces an artifact only: no rules deployment, account creation or migration.
      - run: npm run android:sync -- --production --email-only
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: mes-comptes-android-connected-email-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
